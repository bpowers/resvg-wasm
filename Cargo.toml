[package]
name = "resvg-wasm"
version = "0.1.3"
description = "resvg as a wasm module"
repository = "https://github.com/bpowers/resvg-wasm"
authors = ["Bobby Powers <bobbypowers@gmail.com>"]
license = "MPL-2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
resvg = { version = "0.47", default-features = false, features = ["text"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
